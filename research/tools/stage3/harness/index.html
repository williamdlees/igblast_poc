<!doctype html>
<meta charset="utf-8">
<title>Pyodide reference preparation check</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
<script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<pre id="result">Starting</pre>
<i class="bi bi-search" aria-hidden="true"></i>
<script>
const result = document.getElementById('result');
document.body.dataset.status = 'running';
const worker = new Worker('/research/tools/stage3/harness/py-worker.js');
const timeout = setTimeout(() => {
  worker.terminate();
  result.textContent = JSON.stringify({ error: 'Pyodide worker timed out' });
  document.body.dataset.status = 'error';
}, 600000);
worker.onerror = event => {
  clearTimeout(timeout);
  result.textContent = JSON.stringify({ error: event.message });
  document.body.dataset.status = 'error';
};
worker.onmessage = ({ data }) => {
  clearTimeout(timeout);
  result.textContent = JSON.stringify(data, null, 2);
  (async () => {
    const fontFaces = await document.fonts.load('16px "bootstrap-icons"');
    const assets = {
      bootstrapCss: [...document.styleSheets].some(sheet =>
        sheet.href?.includes('bootstrap@5.3.2/dist/css/bootstrap.min.css')),
      bootstrapIconsCss: [...document.styleSheets].some(sheet =>
        sheet.href?.includes('bootstrap-icons@1.11.1/font/bootstrap-icons.css')),
      bootstrapJs: Boolean(window.bootstrap),
      iconFontLoaded: fontFaces.length > 0
    };
    document.body.dataset.assets = JSON.stringify(assets);
    const assetsPassed = Object.values(assets).every(Boolean);
    document.body.dataset.status = data.status === 'complete' && assetsPassed ? 'complete' : 'error';
    if (!assetsPassed) {
      result.textContent = JSON.stringify({
        ...data,
        error: 'A third-party OGRDB page resource failed in the COEP test context',
        assets
      }, null, 2);
    }
    worker.terminate();
  })();
};
worker.postMessage({});
</script>
