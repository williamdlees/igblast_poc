<!doctype html>
<meta charset="utf-8">
<title>Storage bridge spike</title>
<pre id="result">Starting</pre>
<script>
const result = document.getElementById('result');
document.body.dataset.status = 'running';

function runWorker(operation, data) {
  return new Promise((resolve, reject) => {
    const worker = new Worker('/research/tools/stage4/storage-worker.js');
    const timeout = setTimeout(() => {
      worker.terminate();
      reject(new Error(`${operation} worker timed out`));
    }, 180000);
    worker.onmessage = ({ data: message }) => {
      clearTimeout(timeout);
      worker.terminate();
      if (message.error) reject(new Error(`${operation}: ${message.error}`));
      else resolve(message.result);
    };
    worker.onerror = event => {
      clearTimeout(timeout);
      worker.terminate();
      reject(new Error(`${operation} worker: ${event.message}`));
    };
    worker.postMessage({ operation, ...data });
  });
}

(async () => {
  let temporaryName;
  try {
    if (!crossOriginIsolated) throw new Error('Cross-origin isolation is unavailable');
    if (!navigator.storage?.getDirectory) throw new Error('OPFS is unavailable');
    const response = await fetch('/research/tests/fixtures/stage2/query.fasta');
    if (!response.ok) throw new Error(`Query fixture: HTTP ${response.status}`);
    const inputFile = new File([await response.blob()], 'query.fasta', {
      type: 'text/plain'
    });
    const database = new Uint8Array(256 * 1024);
    for (let i = 0; i < database.length; i++) database[i] = (i * 31 + 17) & 0xff;
    const databaseDigest = await crypto.subtle.digest('SHA-256', database);
    const expectedDatabaseSha256 = [...new Uint8Array(databaseDigest)]
      .map(value => value.toString(16).padStart(2, '0')).join('');

    const root = await navigator.storage.getDirectory();
    temporaryName = `igblast-storage-spike-${crypto.randomUUID()}`;
    const directory = await root.getDirectoryHandle(temporaryName, { create: true });
    const estimate = await navigator.storage.estimate();
    const prepared = await runWorker('prepare', {
      directory,
      inputFile,
      database,
      expectedDatabaseSha256
    });
    const consumed = await runWorker('consume', {
      directory,
      inputName: 'query.fasta',
      databaseName: 'reference-db.bin',
      expectedInputSha256: prepared.input.sha256,
      expectedDatabaseSha256: prepared.database.sha256
    });
    const cleanup = await runWorker('cleanup', { directory });
    await root.removeEntry(temporaryName);
    temporaryName = null;
    let removed = false;
    try {
      await root.getDirectoryHandle(`igblast-storage-spike-${prepared.runId}`);
    } catch (error) {
      if (error.name !== 'NotFoundError') throw error;
      removed = true;
    }
    if (!removed) throw new Error('Temporary OPFS directory still exists after cleanup');

    const summary = {
      crossOriginIsolated,
      storageEstimate: {
        usage: estimate.usage,
        quota: estimate.quota
      },
      input: prepared.input,
      database: prepared.database,
      workerHandoff: consumed.handoff,
      emscriptenMemfsRoundTrip: consumed.output,
      fileOperations: prepared.fileOperations,
      missingFileError: prepared.missingFileError,
      cleanup: { ...cleanup, temporaryDirectoryRemoved: removed }
    };
    result.textContent = JSON.stringify(summary, null, 2);
    document.body.dataset.status = 'complete';
  } catch (error) {
    if (temporaryName) {
      try {
        const root = await navigator.storage.getDirectory();
        await root.removeEntry(temporaryName, { recursive: true });
      } catch (cleanupError) {
        result.textContent = JSON.stringify({
          error: String(error),
          cleanupError: String(cleanupError)
        });
        document.body.dataset.status = 'error';
        return;
      }
    }
    result.textContent = JSON.stringify({ error: String(error) }, null, 2);
    document.body.dataset.status = 'error';
  }
})();
</script>
